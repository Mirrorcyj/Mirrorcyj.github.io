# Jekyll 配置文件

# 站点基本信息
title: 个人主页
description: 工作心得与技术分享
author: Your Name
email: your.email@example.com
url: https://yourusername.github.io
baseurl: "" # 如果仓库名不是 username.github.io，则填写仓库名

# 构建设置
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# 导航菜单
navigation:
  - title: 首页
    url: /
  - title: 归档
    url: /archive
  - title: 关于
    url: /about

# 社交链接（可选）
social:
  github: yourusername
  email: your.email@example.com

# 分页设置
paginate: 5
paginate_path: "/page:num/"
